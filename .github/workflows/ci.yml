name: CI

# Netlify builds and publishes this site on every push to main. That build is
# the deploy, not a test: `next.config.js` sets eslint.ignoreDuringBuilds, so a
# lint or type error would ship silently. This workflow is the gate — it runs
# the three checks Netlify does not.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `npm install`: it fails loudly when
      # package-lock.json and package.json have drifted apart.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # Caching .next/cache keeps subsequent builds off a cold start.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            next-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Must follow the build, not precede it. next-env.d.ts is what declares the
      # module types for `import logo from './logo.png'`, and it is generated by
      # `next build` and gitignored — so on a fresh checkout tsc fails on the
      # image imports in app/experience/volunteer.tsx until a build has run.
      # `next build` type-checks as well; this step is here for the fuller output.
      - name: Typecheck
        run: npm run typecheck
